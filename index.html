<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotionForge</title>
    <link rel="shortcut icon" href="./assets/imgs/favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="assets/output.css" />
    <link rel="stylesheet" href="assets/fonts/style.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">
</head>

<header class="bg-orange-700 p-3 relative flex items-center align-middle justify-center">
    <div class="me-auto my-auto flex items-center">
        <i class="ph ph-hamburger px-3 text-2xl my-auto cursor-pointer"></i>
    </div>
    <div class="flex items-center px-3 justify-center text-center">
        <h1 class="font-light text-2xl text-center transition-all duration-500">MotionForge</h1>
    </div>
    <div class="ms-auto my-auto flex items-center">
        <i class="ph ph-hamburger px-3 text-2xl my-auto cursor-pointer"></i>
    </div>
</header>

<body class="bg-black text-white overflow-x-hidden">

    <!-- original / collapsed -->
    <div id="playerContainer"
        class="fixed  bottom-0 w-full max-h-[10vh] z-50 flex bg-neutral-500 items-center justify-center">
        <div class="relative h-auto w-screen ">
            <input type="range" min="0" max="100" value="0" id="playerSlider" />
            <audio id="currentPlayer" src="assets/audio/Millionaire Yo Yo Honey Singh.mp3" class="" controls
                hidden></audio>
            <div class="md:flex lg:flex xl:flex xxl:flex block p-2 px-5 justify-between" style="transition: 0.3s all">
                <div class="flex items-center">
                    <div class="controls toggler cursor-pointer" onclick="togglePlayer()">
                        <pre>||</pre>
                    </div>
                    <div class="controls ps-3 next cursor-pointer" onclick="togglenext()">
                        |><span class="-ms-1.5 ">|</span>
                    </div>
                    <div class="duration ms-4" onclick="toggleFullPlayer()" style="transition: 0.3s all">0</div>
                    <div class="ms-5 -rotate-90 text-2xl" id="fullScreenToggle" onclick="toggleFullPlayer()">></div>
                </div>
                <div class="flex items-center">
                    
                    <img src="#" alt="" id="thumb" class="h-[5vh] thumb rounded-[5px]">
                    <div class="currentTitle ps-4 end-0" style="text-overflow: ellipsis; text-wrap: wrap;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- current player -->

    <section id="playerFullScreen" class="bg-blue-950 overflow-x-hidden absolute top-0 left-0 h-screen w-screen z-20 hidden">
        <div class="relative w-full h-full  backdropfilter">
            <span class="absolute top-1/2 text-4xl -translate-y-1/2 left-1/5 z-10 ">< </span>
            <span class="absolute top-1/2 text-4xl -translate-y-1/2 right-1/5 z-10">> </span>
            <img src="#" alt="" id="thumbNext" class="h-[40vh] thumb rounded-2xl absolute top-1/2 left-1/2 opacity-50 scale-90 -translate-y-1/2 -translate-x-full z-10">
            <img src="#" alt="" id="thumb" class="h-[40vh] thumb rounded-2xl absolute top-1/2 left-1/2 -translate-1/2 z-30">
            <img src="assets/audio/thumb/Blue Eyes_Yo Yo Honey Singh.jpg" alt="" id="thumbPrev" class="h-[40vh] rounded-2xl absolute top-1/2 left-1/2 opacity-50 scale-90 -translate-y-1/2 z-10">
            <div id="title" class="ps-4 pt-4 text-5xl font-bold currentTitle start-0 absolute z-10"
                style="text-overflow: ellipsis; text-wrap: wrap;">name</div>
         </div>
    </section>


    <section class="">
        <h1 class="text-indigo-200 text-3xl p-3 ps-6">For You</h1>

        <div id="foryouSlider" class="flex overflow-auto"></div>


    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
    <script src="assets/collection.js"></script>
    <script src="assets/libs/core.js"></script>
    <script src="assets/libs/script.js"></script>
    <script src="assets/libs/gsap.js"></script>
    
    <!-- <script src="assets/libs/template.js"></script> -->
</body>

</html>
